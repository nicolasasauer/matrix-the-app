name: Build & Release

# Benötigte Repository-Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    Upload-Keystore (.jks) als Base64: `base64 -w0 upload-keystore.jks`
#   ANDROID_KEYSTORE_PASSWORD  Passwort des Keystores
#   ANDROID_KEY_ALIAS          Alias des Schlüssels im Keystore
#   ANDROID_KEY_PASSWORD       Passwort des Schlüssels
# Optional, für den automatischen Upload in die Play Console:
#   PLAY_SERVICE_ACCOUNT_JSON  JSON-Key eines Service-Accounts mit Release-Rechten
#
# Optionale Repository-Variablen (Settings → Secrets and variables → Actions → Variables):
#   VERSION_CODE_OFFSET   wird zur Run-Nummer addiert (Standard 0), falls schon höhere
#                         versionCodes in Play hochgeladen wurden
#   PLAY_TRACK            internal | alpha | beta | production (Standard: internal)
#   PLAY_RELEASE_STATUS   draft | completed (Standard: draft – solange die App in der
#                         Play Console noch nicht veröffentlicht ist, geht nur draft)

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

  build:
    name: Build signed APK & AAB
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: read
    outputs:
      signed: ${{ steps.keystore.outputs.signed }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Restore upload keystore from secrets
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
              echo "::error::Release-Tag ohne Signing-Secrets – Abbruch."
              exit 1
            fi
            echo "::warning::Keine Signing-Secrets vorhanden – Build wird mit Debug-Key signiert (nicht für Play geeignet)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          {
            echo "storeFile=upload-keystore.jks"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Compute version
        id: version
        env:
          OFFSET: ${{ vars.VERSION_CODE_OFFSET || '0' }}
        run: |
          BUILD_NUMBER=$(( GITHUB_RUN_NUMBER + OFFSET ))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            BUILD_NAME="${GITHUB_REF_NAME#v}"
          else
            BUILD_NAME=$(grep '^version:' pubspec.yaml | sed -E 's/version: *([^+]+).*/\1/')
          fi
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "build_name=$BUILD_NAME" >> "$GITHUB_OUTPUT"
          echo "Version: $BUILD_NAME ($BUILD_NUMBER)"

      - name: Build release App Bundle (für Google Play)
        run: >
          flutter build appbundle --release --no-tree-shake-icons
          --build-name=${{ steps.version.outputs.build_name }}
          --build-number=${{ steps.version.outputs.build_number }}

      # Nur ARM (32 + 64 Bit) – deckt praktisch alle Android-Handys ab und
      # spart die x86-Teile, die nur Emulatoren brauchen.
      - name: Build release APK (zum direkten Installieren, ARM)
        run: >
          flutter build apk --release --no-tree-shake-icons
          --target-platform android-arm,android-arm64
          --build-name=${{ steps.version.outputs.build_name }}
          --build-number=${{ steps.version.outputs.build_number }}

      - name: Remove keystore
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: matrix-release
          path: |
            build/app/outputs/bundle/release/app-release.aab
            build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  play-upload:
    name: Upload to Google Play
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') && needs.build.outputs.signed == 'true'
    permissions:
      contents: read
    steps:
      - name: Check for Play credentials
        id: creds
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -z "$PLAY_JSON" ]; then
            echo "::notice::PLAY_SERVICE_ACCOUNT_JSON nicht gesetzt – Play-Upload übersprungen. Die .aab liegt im Release zum manuellen Hochladen."
            echo "available=false" >> "$GITHUB_OUTPUT"
          else
            echo "available=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download build artifacts
        if: steps.creds.outputs.available == 'true'
        uses: actions/download-artifact@v4
        with:
          name: matrix-release
          path: out/

      - name: Upload to Play Console
        if: steps.creds.outputs.available == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.nicolasasauer.matrix_the_app
          releaseFiles: out/bundle/release/app-release.aab
          track: ${{ vars.PLAY_TRACK || 'internal' }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'draft' }}

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: matrix-release
          path: out/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Matrix ${{ github.ref_name }}
          body: |
            ## Matrix – Das Kartentrinkspiel ${{ github.ref_name }}

            ### Installation
            Lade die APK herunter und installiere sie auf deinem Android-Gerät.
            Eventuell musst du „Installation aus unbekannten Quellen“ erlauben.

            Die `.aab`-Datei ist für den Upload in die Google Play Console.
          files: |
            out/flutter-apk/app-release.apk
            out/bundle/release/app-release.aab
          draft: false
          prerelease: false
